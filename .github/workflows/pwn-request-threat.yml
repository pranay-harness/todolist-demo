name: Build Android app
on:
  push:
    branches:
      - main
      - fix-ci
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    paths:
      - 'custom-payment-flow/client/android-kotlin/**'
      - '!**.css'
      - '!**.md'

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after || github.event.pull_request.head.sha }}
        
      - name: Build
        working-directory: custom-payment-flow/client/android-kotlin
        run: |
          ./gradlew build

  dependabot-auto-merge:
    if: ${{ github.event.pull_request && github.actor == 'dependabot[bot]' }}
    needs: android_build
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/wf_dependabot.yaml
    # `secrets: inherit` is deliberately not used: it forwards every repository secret to
    # the called workflow, and this workflow is triggered by pull_request_target, i.e. it
    # runs with untrusted pull request content. GITHUB_TOKEN is passed to reusable
    # workflows automatically with the permissions granted above, which is all the
    # dependabot auto-merge job needs; add explicit `secrets:` entries for anything else.
