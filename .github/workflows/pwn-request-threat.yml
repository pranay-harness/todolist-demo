name: Build Android app
on:
  push:
    branches:
      - main
      - fix-ci
  workflow_dispatch:
  # Untrusted PR code is checked out and built (./gradlew build) below, so this
  # must run in the `pull_request` context (read-only token, no repo secrets)
  # instead of `pull_request_target`, which would expose secrets to fork code.
  pull_request:
    branches:
      - main
    paths:
      - 'custom-payment-flow/client/android-kotlin/**'
      - '!**.css'
      - '!**.md'

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.after || github.event.pull_request.head.sha }}
        
      - name: Build
        working-directory: custom-payment-flow/client/android-kotlin
        run: |
          ./gradlew build

  dependabot-auto-merge:
    if: ${{ github.event.pull_request && github.actor == 'dependabot[bot]' }}
    needs: android_build
    permissions:
      contents: write
      pull-requests: write
    # No secrets are forwarded: the callee must declare the secrets it needs via
    # `on.workflow_call.secrets` and they must be passed here explicitly by name.
    uses: ./.github/workflows/wf_dependabot.yaml
