name: Build Android app
on:
  push:
    branches:
      - main
      - fix-ci
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    paths:
      - 'custom-payment-flow/client/android-kotlin/**'
      - '!**.css'
      - '!**.md'

jobs:
  android_build:
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the repository to build it.
    permissions:
      contents: read
    steps:
      # Pwn request (CWE-829): this workflow is also triggered by `pull_request_target`, which
      # runs in the base repository's privileged context (repository secrets and a
      # write-capable GITHUB_TOKEN) and this job then *executes* the checked-out tree via
      # `./gradlew build`. Checking out `github.event.pull_request.head.sha` would therefore
      # execute attacker-controlled code with access to secrets. Use the default ref instead:
      # the trusted base branch for `pull_request_target`, and GITHUB_SHA for
      # push / workflow_dispatch runs.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        working-directory: custom-payment-flow/client/android-kotlin
        run: |
          ./gradlew build

  dependabot-auto-merge:
    if: ${{ github.event.pull_request && github.actor == 'dependabot[bot]' }}
    needs: android_build
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/wf_dependabot.yaml
    # Least privilege (CWE-250): secrets are NOT inherited here, because inheriting hands
    # the called workflow every repository and organization secret. Auto-merge only needs the
    # automatic GITHUB_TOKEN, which the callee receives via the `permissions:` block above.
    # If the callee later declares `workflow_call.secrets`, pass just those explicitly:
    #   secrets:
    #     SOME_SECRET: ${{ secrets.SOME_SECRET }}
