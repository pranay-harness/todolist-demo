name: PHP CI

on:
  push:
    paths:
      - 'php-app/**'
  pull_request:
    paths:
      - 'php-app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.1'
      - run: composer test
