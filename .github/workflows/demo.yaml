on:
  # The build job checks out and executes untrusted PR code (npm install/build),
  # so it must run only in the `pull_request` context (read-only token, no repo
  # secrets). `pull_request_target` would hand those secrets to fork code.
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5  # master
      - run: |
          npm install
          npm build

      - uses: ./.github/actions/do-a-local-action
        with:
          arg1: ${{ secrets.supersecret1 }}

      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355
        with:
          arg2: ${{ secrets.supersecret2 }}

      - uses: docker://alpine@sha256:402d21757a03a114d273bbe372fa4b9eca567e8b6c332fa7ebf982b902207242

      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355  # full-length form of the short SHA used here (unverified — could not resolve upstream)
        with:
          arg2: ${{ secrets.supersecret2 }}
 
      # TODO(supply-chain): replace with the real commit SHA for v1 — the upstream
      # repository could not be resolved, so this pin is a placeholder.
      - uses: fakerepo/comment-on-pr@0000000000000000000000000000000000000000  # v1 (unverified — could not resolve upstream)
        with:
          message: |
            Thank you!
 
      # TODO(supply-chain): this step had no ref at all; replace with the real
      # commit SHA — the upstream repository could not be resolved.
      - uses: fakerepo/comment-on-pr@0000000000000000000000000000000000000000  # unpinned upstream (unverified — could not resolve upstream)
        with:
          message: |
            Thank you!
      
      # curl with --insecure flag
      - name: curl with --insecure flag
        run: curl --insecure http://www.example.com/

      # wget with --no-check-certificate flag
      - name: wget with --no-check-certificate flag
        run: wget --no-check-certificate http://ipv4.download.thinkbroadband.com/10MB.zip

      # curl with -k flag
      - name: curl with -k flag
        run: curl -k http://www.example.com/

      # wget with HTTPS
      - name: wget with HTTPS
        run: wget https://www.example.com/ --output-document=securefile.txt

      # curl with HTTPS
      - name: curl with HTTPS
        run: curl https://www.example.com/ -o securefile.txt

      # Commands using HTTP
      - name: curl HTTP request
        run: curl http://www.example.com/

      - name: wget HTTP download
        run: wget http://ipv4.download.thinkbroadband.com/10MB.zip

      - name: Run curl with --proxy-insecure flag
        run: |
          curl --proxy-insecure -x http://proxy.example.com:8080 http://www.example.com/

      - uses: docker://gcr.io/cloud-builders/gradle

      - uses: docker://alpine:3.8

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88  # v2
        with:
          sarif_file: semgrep.sarif
        if: always()

  build2:
    name: Build and test using a local workflow
    uses: ./.github/workflows/use_a_local_workflow.yml@master
    secrets: inherit
    with:
      examplearg: true
  
  docker-build:
    runs-on: ubuntu-latest
    env:
      workdir: lambdas/run-semgrep
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2
      - name: Build Docker image
        working-directory:
          ${{ env.workdir }}/src
     
        run: docker build -t semgrep-scanner:latest .
      - name:
          blah
        run: |
          # Remote responses are untrusted input: fetch and print them only.
          # Never eval/pipe remote data into a shell — the remote server could
          # then execute arbitrary commands on this runner.
          CONTENTS=$(curl --fail --silent --show-error https://blah.com)
          printf '%s\n' "$CONTENTS"
