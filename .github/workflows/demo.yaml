on:
  pull_request_target:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # Pwn request (CWE-829): `pull_request_target` runs this job in the base repository's
      # privileged context (repository secrets such as `secrets.supersecret1` and a
      # write-capable GITHUB_TOKEN), and the job then *executes* the checked-out tree
      # (`npm install` / `npm build`, local actions). Checking out
      # `github.event.pull_request.head.sha` would hand any PR author arbitrary code execution
      # with those secrets. Check out the default (trusted base) ref instead.
      # Supply chain (CWE-1357/CWE-353): actions are pinned to full-length immutable
      # commit SHAs. A mutable tag or branch lets the action owner (or anyone who
      # compromises that repository) silently change the code this workflow executes.
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2

      - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5  # master branch head at pin time
      - run: |
          npm install
          npm build

      - uses: ./.github/actions/do-a-local-action
        with:
          arg1: ${{ secrets.supersecret1 }}

      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355
        with:
          arg2: ${{ secrets.supersecret2 }}

      - uses: docker://alpine@sha256:402d21757a03a114d273bbe372fa4b9eca567e8b6c332fa7ebf982b902207242

      # Truncated commit SHAs are not immutable (short prefixes can collide / be
      # ambiguous); expanded to the full 40-character SHA already used for this same
      # action above.
      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355
        with:
          arg2: ${{ secrets.supersecret2 }}
 
      # UNRESOLVABLE PIN — mutable reference left in place on purpose. `@v1` is a movable
      # tag, but https://github.com/fakerepo/comment-on-pr does not exist upstream
      # (`git ls-remote` -> "Repository not found"), so no real commit SHA can be
      # resolved and none may be invented (a fabricated SHA fails as "unable to resolve
      # action"). Replace this step with a real action and pin it to a full 40-char SHA.
      - uses: fakerepo/comment-on-pr@v1
        with:
          message: |
            Thank you!
 
      # UNRESOLVABLE PIN — mutable reference left in place on purpose. This reference has
      # no ref at all (implicitly the action's default branch, fully mutable), and
      # https://github.com/fakerepo/comment-on-pr does not exist upstream, so no real
      # commit SHA can be resolved and none may be invented. Replace this step with a
      # real action and pin it to a full 40-char SHA.
      - uses: fakerepo/comment-on-pr
        with:
          message: |
            Thank you!
      
      # curl with --insecure flag
      - name: curl with --insecure flag
        run: curl --insecure http://www.example.com/

      # wget with --no-check-certificate flag
      - name: wget with --no-check-certificate flag
        run: wget --no-check-certificate http://ipv4.download.thinkbroadband.com/10MB.zip

      # curl with -k flag
      - name: curl with -k flag
        run: curl -k http://www.example.com/

      # wget with HTTPS
      - name: wget with HTTPS
        run: wget https://www.example.com/ --output-document=securefile.txt

      # curl with HTTPS
      - name: curl with HTTPS
        run: curl https://www.example.com/ -o securefile.txt

      # Commands using HTTP
      - name: curl HTTP request
        run: curl http://www.example.com/

      - name: wget HTTP download
        run: wget http://ipv4.download.thinkbroadband.com/10MB.zip

      - name: Run curl with --proxy-insecure flag
        run: |
          curl --proxy-insecure -x http://proxy.example.com:8080 http://www.example.com/

      - uses: docker://gcr.io/cloud-builders/gradle

      - uses: docker://alpine:3.8

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88  # v2
        with:
          sarif_file: semgrep.sarif
        if: always()

  build2:
    name: Build and test using a local workflow
    uses: ./.github/workflows/use_a_local_workflow.yml@master
    # Least privilege (CWE-250): secrets are NOT inherited here, because inheriting hands
    # the called workflow every repository and organization secret. Pass only the secrets the callee
    # declares under `workflow_call.secrets`, e.g.:
    #   secrets:
    #     supersecret1: ${{ secrets.supersecret1 }}
    with:
      examplearg: true
  
  docker-build:
    runs-on: ubuntu-latest
    env:
      workdir: lambdas/run-semgrep
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2
      - name: Build Docker image
        working-directory:
          ${{ env.workdir }}/src
     
        run: docker build -t semgrep-scanner:latest .
      # Remote code execution via curl-into-eval (CWE-78) removed: the step here fetched
      # the body of an untrusted endpoint and passed it straight to `eval`, so whoever
      # controls that endpoint (or any network position in front of it) could run arbitrary
      # commands on the runner with this workflow's GITHUB_TOKEN and secrets in scope.
      # Quoting cannot make that safe -- executing downloaded content *is* the vulnerability.
      # The step had no build purpose (placeholder name, placeholder host, output unused), so
      # the sink is deleted rather than reimplemented. If a remote artifact is ever needed
      # here, download it to a file from a pinned URL, verify a known checksum/signature, and
      # run it as data -- never `eval` a response body.
