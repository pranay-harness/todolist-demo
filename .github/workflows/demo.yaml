on:
  # The `build` job below checks out and executes pull request code
  # (`npm install` / `npm build` run attacker-authored scripts on fork PRs), so
  # it must run only on `pull_request`, where fork PRs get a read-only
  # GITHUB_TOKEN and no repository secrets. The privileged
  # `pull_request_target` trigger was removed: it runs in the base-repository
  # context with secrets and a write-capable token, so checking out the PR head
  # there is a "pwn request" (CWE-829). The job already ran on `pull_request`,
  # so no functionality is lost.
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by the `upload-sarif` step below; unchanged in scope.
      security-events: write
    steps:
      # No `ref:` override: check out the default (trusted) merge ref for this
      # event instead of an attacker-controlled `pull_request.head.sha`.
      # Third-party/first-party actions are pinned to a full-length, immutable
      # commit SHA (CWE-1357/CWE-353): a branch or floating major tag lets the
      # code that runs in CI change without any change to this repository.
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      # `@master` resolved to the current head of that branch at pin time.
      # Consider moving to a maintained release tag of actions/setup-node.
      - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # master@2026-09-15
      - run: |
          npm install
          npm build

      - uses: ./.github/actions/do-a-local-action
        with:
          arg1: ${{ secrets.supersecret1 }}

      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355
        with:
          arg2: ${{ secrets.supersecret2 }}

      - uses: docker://alpine@sha256:402d21757a03a114d273bbe372fa4b9eca567e8b6c332fa7ebf982b902207242

      # Abbreviated SHAs are ambiguous/mutable; expanded to the full 40-char
      # digest already used for this action above. UNVERIFIED: the repository
      # `completely/fakeaction` does not exist upstream, so the digest could
      # not be confirmed with `git ls-remote` - needs human review.
      - uses: completely/fakeaction@5fd3084fc36e372ff1fff382a39b10d03659f355
        with:
          arg2: ${{ secrets.supersecret2 }}

      # UNVERIFIED PLACEHOLDER PIN - NEEDS HUMAN REVIEW: the repository
      # `fakerepo/comment-on-pr` does not exist on GitHub, so no real commit
      # SHA can be resolved. The null SHA below is an immutable, deliberately
      # unresolvable reference so this step fails closed instead of executing
      # whatever a mutable `@v1` tag may point at if the name is ever
      # registered/squatted. Replace with the real action and its resolved
      # commit SHA, or delete the step.
      - uses: fakerepo/comment-on-pr@0000000000000000000000000000000000000000
        with:
          message: |
            Thank you!

      # UNVERIFIED PLACEHOLDER PIN - NEEDS HUMAN REVIEW: same non-existent
      # repository, and previously referenced with no ref at all (fully
      # mutable). See the note above.
      - uses: fakerepo/comment-on-pr@0000000000000000000000000000000000000000
        with:
          message: |
            Thank you!
      
      # curl with --insecure flag
      - name: curl with --insecure flag
        run: curl --insecure http://www.example.com/

      # wget with --no-check-certificate flag
      - name: wget with --no-check-certificate flag
        run: wget --no-check-certificate http://ipv4.download.thinkbroadband.com/10MB.zip

      # curl with -k flag
      - name: curl with -k flag
        run: curl -k http://www.example.com/

      # wget with HTTPS
      - name: wget with HTTPS
        run: wget https://www.example.com/ --output-document=securefile.txt

      # curl with HTTPS
      - name: curl with HTTPS
        run: curl https://www.example.com/ -o securefile.txt

      # Commands using HTTP
      - name: curl HTTP request
        run: curl http://www.example.com/

      - name: wget HTTP download
        run: wget http://ipv4.download.thinkbroadband.com/10MB.zip

      - name: Run curl with --proxy-insecure flag
        run: |
          curl --proxy-insecure -x http://proxy.example.com:8080 http://www.example.com/

      - uses: docker://gcr.io/cloud-builders/gradle

      - uses: docker://alpine:3.8

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        # Subdirectory action: the repository (github/codeql-action) SHA is
        # pinned in `owner/repo/path@sha` form.
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1
        with:
          sarif_file: semgrep.sarif
        if: always()

  build2:
    name: Build and test using a local workflow
    uses: ./.github/workflows/use_a_local_workflow.yml@master
    # Least privilege: do not inherit all caller/org secrets. The called
    # workflow declares no `workflow_call.secrets` and only takes `examplearg`.
    # Pass any future requirement explicitly by name, e.g.
    # `secrets: {NAME: ${{ secrets.NAME }}}`.
    with:
      examplearg: true
  
  docker-build:
    runs-on: ubuntu-latest
    env:
      workdir: lambdas/run-semgrep
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Build Docker image
        working-directory:
          ${{ env.workdir }}/src
     
        run: docker build -t semgrep-scanner:latest .
      # Removed a step that downloaded a remote URL and passed the response
      # body to `eval` (CWE-78): the remote host, or anyone able to tamper with
      # the response, could execute arbitrary shell commands on the runner.
      # There is no legitimate artifact behind that URL, so nothing is fetched
      # here any more. If this job ever needs a real dependency, install it
      # from a pinned version and verify a published checksum/signature before
      # running it -- never `eval`/`bash` content straight off the network.
