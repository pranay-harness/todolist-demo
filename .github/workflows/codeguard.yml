name: CodeGuard
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (CWE-1357/CWE-353): this
      # job hands secrets to a third-party action, so a mutable tag would let
      # its maintainer (or anyone who compromises it) change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: DNYoussef/codeguard-action@9147821fafaf7b290abc0cf645a7c591f9da684c # v1.0.5
        id: guard
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-bundle-${{ github.event.pull_request.number }}
          path: .guardspine/bundles/
